<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — Approach International Student Center</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="navbarContainer"></div>

<main class="page">
  <div class="page-header">
    <div>
      <div class="page-stamp">Tools</div>
      <h1>QR Code <em>Generator</em></h1>
    </div>
  </div>

  <div class="qr-container">
    <div class="qr-section">
      <div class="qr-input-card">
        <h2>Input Link</h2>
        <div class="form-field">
          <label for="qrInput">Enter URL or Text</label>
          <textarea id="qrInput" placeholder="Paste your link or text here..."></textarea>
        </div>

        <div class="form-field">
          <label>QR Code Color</label>
          <div class="color-options" id="colorOptions"></div>
          <div class="form-field" style="margin-bottom:0;">
            <label for="customColor">Or choose a custom color:</label>
            <div class="color-picker-wrapper">
              <input type="color" id="customColor" class="custom-color-picker" value="#0C2340">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="qr-section">
      <div class="qr-preview-card">
        <h2>QR Code Preview</h2>
        <div class="qr-preview-box" id="qrPreviewBox">
          <div class="qr-placeholder">Your QR code will appear here</div>
        </div>
        <div class="qr-actions">
          <button class="qr-btn primary" id="downloadBtn" disabled>⬇ Download</button>
          <button class="qr-btn secondary" id="copyBtn" disabled>📋 Copy</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="copyright">Copyright © 2026 Approach International Student Center, Inc. — All rights reserved.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="js/pages/qr-generator.js"></script>
</body>
</html>
