<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Approach International Student Center</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="navbarContainer"></div>

<main class="centered">
  <div class="card profile">
    <div class="institutional-mark">
      <img src="images/black-logo.png" alt="Approach International Student Center">
      <div class="institutional-name">Approach<em>USA</em></div>
      <div class="institutional-sub">International Student Center</div>
    </div>

    <h1 class="text-center">Account <em>Profile</em></h1>

    <div class="alert error" id="errorAlert"></div>
    <div class="alert success" id="successAlert"></div>

    <!-- User Info Section -->
    <div class="info-section">
      <div class="info-row"><span class="info-label">Email</span><span class="info-value" id="emailDisplay">—</span></div>
      <div class="info-row"><span class="info-label">Full Name</span><span class="info-value" id="fullNameDisplay">—</span></div>
      <div class="info-row"><span class="info-label">Role</span><span class="info-value" id="roleDisplay">—</span></div>
      <div class="info-row"><span class="info-label">Account Created</span><span class="info-value" id="createdDisplay">—</span></div>
    </div>

    <!-- Change Name Form -->
    <div class="form-section">
      <h2>Change Name</h2>
      <form id="nameForm">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required minlength="2">
        </div>
        <button type="submit" class="btn btn--primary" id="nameSubmitBtn">Update Name</button>
      </form>
    </div>

    <!-- Change Password Form -->
    <div class="form-section">
      <h2>Change Password</h2>
      <form id="passwordForm">
        <div class="field">
          <label for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" required autocomplete="current-password">
        </div>
        <div class="field">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required autocomplete="new-password">
          <div class="validation-rules">
            <div class="rule" id="ruleLength">At least 8 characters</div>
            <div class="rule" id="ruleLetter">Contains a letter</div>
            <div class="rule" id="ruleNumber">Contains a number</div>
          </div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn--primary" id="passwordSubmitBtn">Change Password</button>
      </form>
    </div>

    <a href="#" class="back-link" id="backLink">← Back to Dashboard</a>
  </div>
</main>

<div class="copyright">
  Copyright © 2026 Approach International Student Center, Inc. — All rights reserved.
</div>

<script type="module" src="js/pages/profile.js"></script>
</body>
</html>
