<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Reader — Approach International Student Center</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="qrread-page">

<header class="qrread-header">
  <div class="logo-icon" aria-hidden="true"><i class="ti ti-qrcode"></i></div>
  <div>
    <h1>QR Reader</h1>
    <p>Scan &amp; Decode</p>
  </div>
</header>

<main class="qrread-main">

  <!-- Camera Card -->
  <div class="qrread-card">
    <div class="qrread-card-header">
      <i class="ti ti-camera" aria-hidden="true"></i>
      <span>Viewfinder</span>
      <span id="status-badge" class="qrread-badge idle" style="margin-left:auto"><i class="ti ti-circle" aria-hidden="true"></i> Idle</span>
    </div>
    <div class="qrread-card-body">
      <div id="video-wrap" role="img" aria-label="Camera viewfinder">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="corner corner-tl" aria-hidden="true"></div>
        <div class="corner corner-tr" aria-hidden="true"></div>
        <div class="corner corner-bl" aria-hidden="true"></div>
        <div class="corner corner-br" aria-hidden="true"></div>
        <div id="scan-line" aria-hidden="true"></div>
        <div id="overlay-msg" aria-live="polite">
          <i class="ti ti-camera-off" aria-hidden="true"></i>
          <span>Camera not started</span>
        </div>
        <div id="flash" aria-hidden="true"></div>
      </div>

      <div class="qrread-btn-row">
        <button class="qrread-btn primary" id="cam-btn">
          <i class="ti ti-video" aria-hidden="true"></i> Start Camera
        </button>
        <button class="qrread-btn secondary qrread-btn-upload" aria-label="Upload image with QR code">
          <i class="ti ti-upload" aria-hidden="true"></i> Upload Image
          <input type="file" id="file-input" accept="image/*" aria-label="Choose image file">
        </button>
      </div>
    </div>
  </div>

  <!-- Result Card -->
  <div class="qrread-card">
    <div class="qrread-card-header"><i class="ti ti-code" aria-hidden="true"></i><span>Result</span></div>
    <div class="qrread-card-body">
      <div id="result-box" aria-live="polite" aria-label="Scan result">
        <div class="icon-wrap"><i class="ti ti-qrcode" id="result-icon" aria-hidden="true"></i></div>
        <span id="result-text" class="placeholder">Awaiting scan…</span>
        <div class="result-actions">
          <button class="qrread-icon-btn" id="copy-btn" style="display:none" title="Copy to clipboard" aria-label="Copy result"><i class="ti ti-copy" aria-hidden="true"></i></button>
          <button class="qrread-icon-btn" id="open-btn" style="display:none" title="Open URL" aria-label="Open URL"><i class="ti ti-external-link" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- History Card -->
  <div class="qrread-card" id="history-section">
    <div class="qrread-card-header">
      <i class="ti ti-history" aria-hidden="true"></i>
      <span>Recent Scans</span>
      <button class="qrread-icon-btn" id="clear-history-btn" style="margin-left:auto" title="Clear history" aria-label="Clear scan history"><i class="ti ti-trash" aria-hidden="true"></i></button>
    </div>
    <div class="qrread-card-body" style="padding-top:0.75rem">
      <ul id="history-list" aria-label="Scan history"></ul>
    </div>
  </div>

</main>

<footer class="qrread-footer">QR Reader — jsQR</footer>

<div id="qrread-toast" role="status" aria-live="polite">
  <i class="ti ti-check" aria-hidden="true"></i>
  <span id="toast-text">Copied!</span>
</div>

<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module" src="js/pages/qr-reader.js"></script>
</body>
</html>
